services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - butterloom

  butterloom:
    build: .
    container_name: butterloom
    restart: unless-stopped
    # No host ports — only Caddy talks to this container
    expose:
      - "3000"
    volumes:
      - butterloom-data:/app/var
    env_file:
      - .env
    environment:
      - PORT=3000
      - BUTTERLOOM_DB=/app/var/butterloom.db
      - BUTTERLOOM_MEDIA_DIR=/app/var/media
      - BUTTERLOOM_MEDIA_BASE_URL=/media

volumes:
  caddy-data:
  caddy-config:
  butterloom-data:
