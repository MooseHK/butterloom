<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>butterloom</title>
<style>
  :root { color-scheme: light dark }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:600 clamp(2rem,12vw,5rem)/1.2 system-ui, sans-serif; text-align:center }
  small { display:block; font:400 1rem/1.6 ui-monospace, monospace; opacity:.6; margin-top:1.5rem }
</style>
<div>
  hello world 👋
  <small id="v">butterloom</small>
</div>
<script>
  // ponytail: proves which deploy you're looking at, no build step needed
  fetch('https://api.github.com/repos/MooseHK/butterloom/commits/main')
    .then(r => r.json())
    .then(c => v.textContent = c.sha.slice(0,7) + ' · ' + c.commit.message.slice(0,40))
    .catch(() => {});
</script>
