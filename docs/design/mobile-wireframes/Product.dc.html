<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fbf8f5;color:#22201e;font:15px/1.55 system-ui,-apple-system,sans-serif}
    a{color:#22201e;text-decoration:none}
    a:hover{color:#7a5c3e}
    .screen{position:relative;width:390px;min-height:844px;display:flex;flex-direction:column;background:#fbf8f5}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid #ded6cd;flex:none}
    .mark{font:600 17px/1 ui-serif,Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
    .cart{display:flex;align-items:center;gap:7px;height:44px;padding:0 8px;font-size:13px}
    .pad{padding:16px;display:flex;flex-direction:column;gap:14px}
    h1{margin:0;font:600 22px/1.25 ui-serif,Georgia,serif}
    h2{margin:0;font:600 14px/1.3 ui-serif,Georgia,serif;letter-spacing:.02em}
    .price{margin:0;font:400 20px/1.2 ui-serif,Georgia,serif}
    .ph{display:grid;place-items:center;border:1px dashed #b5aca2;border-radius:3px;background:#f1ece6;color:#8a8078;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px}
    .shot{aspect-ratio:4/5}
    .bars{display:flex;flex-direction:column;gap:7px}
    .b{height:9px;border-radius:2px;background:#e2dbd3}
    .b.short{width:62%}
    .field{display:flex;flex-direction:column;gap:5px}
    .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#6f665e}
    .qty{display:flex;align-items:center;width:96px;min-height:48px;padding:0 12px;border:1px solid #c9c0b6;border-radius:3px;background:#fff;font-size:15px}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 14px;border:1px solid #22201e;border-radius:3px;background:#22201e;color:#fbf8f5;font:600 15px/1 system-ui,sans-serif}
    .muted{margin:0;color:#6f665e;font-size:13px}
    .sec{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid #ded6cd}
    .fold{position:absolute;left:0;right:0;top:844px;border-top:1px dashed #c0b7ad}
    .fold span{position:absolute;right:6px;top:4px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#a89f96}
    .foot{margin-top:auto;padding:16px;border-top:1px solid #ded6cd;color:#8a8078;font-size:12px;flex:none}
  </style>
</helmet>
<div class="screen">
  <div class="bar">
    <span class="mark">Butterloom</span>
    <span class="cart">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#22201e" stroke-width="1.4" stroke-linejoin="round">
        <path d="M6.5 6.5V5A3 3 0 0 1 9.5 2h1A3 3 0 0 1 13.5 5v1.5"></path>
        <path d="M3.6 6.5h12.8L15.4 18H4.6L3.6 6.5Z"></path>
      </svg>
      Cart 2
    </span>
  </div>
  <div class="pad">
    <div class="ph shot">photograph 1 of 3</div>
    <h1>Jamdani sari — indigo</h1>
    <p class="price">৳6,400</p>
    <div class="bars">
      <div class="b"></div>
      <div class="b"></div>
      <div class="b short"></div>
    </div>
    <div class="field">
      <span class="lab">Quantity</span>
      <div class="qty">1</div>
    </div>
    <div class="btn">Add to cart</div>
    <p class="muted">Cash on delivery, or bKash. Delivered across Bangladesh.</p>
    <div class="sec">
      <h2>More photographs</h2>
      <div class="ph shot">photograph 2 of 3</div>
    </div>
  </div>
  <div class="foot">Butterloom · Delivered across Bangladesh</div>
  <div class="fold"><span>fold · 390 × 844</span></div>
</div>
</x-dc>
</body>
</html>
