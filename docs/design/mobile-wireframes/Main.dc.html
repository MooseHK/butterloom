<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fbf8f5;color:#22201e;font:15px/1.55 system-ui,-apple-system,sans-serif}
    a{color:#22201e;text-decoration:none}
    a:hover{color:#7a5c3e}
    .screen{position:relative;width:390px;min-height:844px;display:flex;flex-direction:column;background:#fbf8f5}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid #ded6cd;flex:none}
    .mark{font:600 17px/1 ui-serif,Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
    .cart{display:flex;align-items:center;gap:7px;height:44px;padding:0 8px;font-size:13px}
    .pad{padding:16px;display:flex;flex-direction:column;gap:14px}
    h1{margin:0;font:600 22px/1.25 ui-serif,Georgia,serif}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px}
    .card{display:flex;flex-direction:column;gap:6px}
    .card .ph{aspect-ratio:4/5}
    .card h2{margin:0;font:500 14px/1.3 ui-serif,Georgia,serif}
    .card p{margin:0;font-size:14px}
    .ph{display:grid;place-items:center;border:1px dashed #b5aca2;border-radius:3px;background:#f1ece6;color:#8a8078;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px}
    .foot{margin-top:auto;padding:16px;border-top:1px solid #ded6cd;color:#8a8078;font-size:12px;flex:none}
  </style>
</helmet>
<div class="screen">
  <div class="bar">
    <span class="mark">Butterloom</span>
    <span class="cart">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#22201e" stroke-width="1.4" stroke-linejoin="round">
        <path d="M6.5 6.5V5A3 3 0 0 1 9.5 2h1A3 3 0 0 1 13.5 5v1.5"></path>
        <path d="M3.6 6.5h12.8L15.4 18H4.6L3.6 6.5Z"></path>
      </svg>
      Cart 2
    </span>
  </div>
  <div class="pad">
    <h1>The collection</h1>
    <div class="grid">
      <div class="card">
        <div class="ph">photograph</div>
        <h2>Jamdani sari — indigo</h2>
        <p>৳6,400</p>
      </div>
      <div class="card">
        <div class="ph">photograph</div>
        <h2>Cotton kurta — ecru</h2>
        <p>৳2,150</p>
      </div>
      <div class="card">
        <div class="ph">photograph</div>
        <h2>Silk dupatta — madder</h2>
        <p>৳1,800</p>
      </div>
      <div class="card">
        <div class="ph">no photograph yet</div>
        <h2>Khadi panjabi — charcoal</h2>
        <p>৳3,250</p>
      </div>
    </div>
  </div>
  <div class="foot">Butterloom · Delivered across Bangladesh</div>
</div>
</x-dc>
</body>
</html>
